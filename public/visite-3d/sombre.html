<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Drawiful — Galerie 3D (Galerie de nuit)</title>

<!--
  Drawiful — salle de visite 3D (ambiance : sombre).
  Affichée dans une iframe par src/app/g/[slug]/visite-3d/page.tsx, qui envoie
  les œuvres via postMessage { type:'GALLERY_SET_ARTWORKS', artworks, galleryName, allowAR }
  après avoir reçu { type:'GALLERY_READY' }. Au clic sur "Voir la fiche de l'œuvre",
  la salle renvoie { type:'GALLERY_ARTWORK_CLICK', id }.
-->

<style>
  :root{
    --wall: #edeae1;
    --ink: #1c1a17;
    --muted: #6b6459;
    --brass: #b8912f;
    --brass-light:#d4b45c;
    --overlay-bg: rgba(15,13,11,0.72);
    --overlay-text:#f5f1e8;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
  }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0c0b0a; font-family:var(--sans); }
  canvas{ display:block; touch-action:none; }

  #loading{
    position:fixed; inset:0; z-index:50; background:#0c0b0a;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--overlay-text); gap:14px; transition:opacity .5s ease;
  }
  #loading .spinner{
    width:34px;height:34px;border-radius:50%;
    border:2px solid rgba(212,180,92,0.25); border-top-color:var(--brass-light);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading .label{ font-family:var(--serif); font-size:15px; letter-spacing:.04em; color:#d8d2c4;}
  #loading.hidden{ opacity:0; pointer-events:none; }

  .hud{ position:fixed; z-index:20; font-family:var(--sans); color:var(--overlay-text); }

  #topbar{
    top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; pointer-events:none;
  }
  #galleryTitle{
    font-family:var(--serif); font-size:16px; letter-spacing:.03em;
    background:var(--overlay-bg); backdrop-filter:blur(8px);
    padding:8px 16px; border-radius:2px; border:1px solid rgba(212,180,92,0.25);
    pointer-events:auto;
  }
  #arToggle{
    pointer-events:auto; font-family:var(--sans); font-weight:600; font-size:12px;
    letter-spacing:.08em; text-transform:uppercase; color:#1a1712;
    background:linear-gradient(180deg,var(--brass-light),var(--brass));
    border:none; padding:10px 18px; border-radius:2px; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  #arToggle:disabled{ opacity:.4; cursor:not-allowed; }

  #hint{
    bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--overlay-bg); backdrop-filter:blur(8px);
    padding:8px 18px; border-radius:20px; font-size:12px; letter-spacing:.03em;
    border:1px solid rgba(255,255,255,0.08); white-space:nowrap;
  }

  #crosshair{
    top:50%; left:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    background:rgba(255,255,255,.55); border-radius:50%; pointer-events:none;
  }

  #infoPanel{
    left:50%; bottom:70px; transform:translateX(-50%) translateY(12px);
    width:min(360px,86vw); background:var(--overlay-bg); backdrop-filter:blur(10px);
    border:1px solid rgba(212,180,92,0.3); border-radius:3px; padding:16px 18px;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  #infoPanel.visible{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  #infoPanel .artist{ font-family:var(--serif); font-style:italic; font-size:12px; color:#c9c2b3; }
  #infoPanel .title{ font-family:var(--serif); font-size:19px; margin:2px 0 6px; color:#fff; }
  #infoPanel .rule{ width:32px; height:1px; background:var(--brass); margin:8px 0; }
  #infoPanel .meta{ font-size:12px; letter-spacing:.02em; color:#a9a397; }
  #infoPanel .price{ font-family:var(--serif); color:var(--brass-light); font-size:16px; margin-top:8px; }
  #infoPanel button{
    margin-top:12px; width:100%; padding:9px; background:transparent;
    border:1px solid var(--brass); color:var(--brass-light); font-family:var(--sans);
    font-size:11px; letter-spacing:.08em; text-transform:uppercase; border-radius:2px; cursor:pointer;
  }
  #infoPanel button:hover{ background:rgba(212,180,92,0.12); }

  #arControls{
    display:none; bottom:26px; left:50%; transform:translateX(-50%);
    gap:10px;
  }
  #arControls.visible{ display:flex; }
  #arControls button{
    pointer-events:auto; font-family:var(--sans); font-size:12px; letter-spacing:.04em;
    background:var(--overlay-bg); color:var(--overlay-text); border:1px solid rgba(212,180,92,0.35);
    padding:9px 14px; border-radius:20px; cursor:pointer;
  }

  .label3d{
    font-family:var(--serif); color:#f2ede1; font-size:12px; text-align:center;
    background:rgba(12,11,10,0.55); backdrop-filter:blur(3px); padding:5px 10px;
    border-top:1px solid var(--brass); white-space:nowrap; pointer-events:none;
  }
  .label3d .a{ font-style:italic; color:#c9c2b3; font-size:10px; display:block; }
  /* Bouton RA natif de Three.js : il se réaffiche tout seul avec "AR NOT SUPPORTED"
     sur les ordinateurs. On le garde invisible ; c'est #arToggle qui le pilote. */
  #ARButton{ display:none !important; }

  #hint{ transition: opacity .6s ease; }
  #hint.faded{ opacity: 0; pointer-events: none; }
  /* Visite œuvre par œuvre */
  #tour{
    right:16px; bottom:16px; display:none; align-items:center; gap:4px;
    background:var(--overlay-bg); backdrop-filter:blur(8px);
    border:1px solid rgba(212,180,92,0.3); border-radius:22px; padding:4px;
  }
  #tour.visible{ display:flex; }
  #tour button{
    pointer-events:auto; background:transparent; border:none; color:var(--overlay-text);
    font-size:20px; width:38px; height:34px; cursor:pointer; border-radius:17px; line-height:1;
    font-family:var(--sans);
  }
  #tour button:hover{ background:rgba(212,180,92,0.15); }
  #tour #tourOverview{
    display:none; width:auto; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    padding:0 12px; color:var(--brass-light);
  }
  #tour.focused #tourOverview{ display:block; }
  /* Mode capture (?capture=1 : sans habillage ; ?capture=2 : sans cartels non plus) */
  body.capture .hud, body.capture #crosshair, body.capture #ARButton{ display:none !important; }
  body.capture-nolabels .label3d{ display:none !important; }
  #tourCount{ font-size:12px; min-width:56px; text-align:center; font-variant-numeric:tabular-nums; color:#d8d2c4; }
  @media (pointer:coarse){
    #hint{ bottom:auto; top:64px; white-space:normal; width:max-content; max-width:86vw; text-align:center; }
    #tour{ right:12px; bottom:calc(14px + env(safe-area-inset-bottom)); }
    #arToggle{ position:fixed; left:12px; top:auto; bottom:calc(16px + env(safe-area-inset-bottom)); font-size:10px; padding:9px 12px; }
    #galleryTitle{ max-width:calc(100vw - 200px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
    #infoPanel{ bottom:calc(66px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

  <div id="loading"><div class="spinner"></div><div class="label">Préparation de la galerie…</div></div>

  <div class="hud" id="topbar">
    <div id="galleryTitle">Galerie</div>
    <button class="hud" id="arToggle" disabled>Voir en RA</button>
  </div>

  <div class="hud" id="hint">Cliquez pour explorer · ZQSD / flèches pour marcher · Échap pour sortir</div>
  <div class="hud" id="crosshair"></div>

  <div class="hud" id="infoPanel">
    <div class="artist" id="ip-artist"></div>
    <div class="title" id="ip-title"></div>
    <div class="rule"></div>
    <div class="meta" id="ip-meta"></div>
    <div class="price" id="ip-price"></div>
    <button id="ip-cta">Voir la fiche de l'œuvre</button>
  </div>

  <div class="hud" id="arControls">
    <button id="arPrev">‹ Précédente</button>
    <button id="arPlace">Poser ici</button>
    <button id="arNext">Suivante ›</button>
  </div>

  <div class="hud" id="tour">
    <button id="tourPrev" aria-label="Œuvre précédente">‹</button>
    <span id="tourCount"></span>
    <button id="tourNext" aria-label="Œuvre suivante">›</button>
    <button id="tourOverview">Vue d'ensemble</button>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// Identité de la salle (matières, fenêtre, décor). Le reste du code est
// commun aux trois salles Drawiful.
const SKIN = {
  // Salle sombre « galerie de nuit » : murs prune-anthracite mats (aubergine
  // Drawiful), parquet chêne fumé verni qui reflète les spots, plinthe laiton
  // qui marque nettement la limite sol / murs, lumière ambrée.
  haussmann:false, floor:'parquet', floorBump:0.5, reflectorColor:0x5a5048, overlayOpacity:0.94, overlayRoughness:0.3,
  marble:{ base:'#e6dfd1', cloudDark:'160,148,130', cloudLight:'255,250,240', vein:'120,108,92', veinAccent:'170,138,84', joint:'110,98,84', jointA:0.16 },
  parquet:{ base:84, spread:24, g:0.8, b:0.66, bg:'#2a221c', grain:'40,22,10', joint:'22,12,6' },
  wallColor:0x3a3634, wallRoughness:0.9, wallBump:0.6, ceilColor:0x120f14,
  ceilGlow:0.0, plinthColor:0x3a2f2b, plinthRough:0.85, woodAccent:true, wallWash:true, centerSpot:true, minBottom:0.35, sun:4.2,
  accentWood:{ base:104, spread:22, g:0.66, b:0.46, groove:'#120a06' },
  spotColor:0xffe3b8,
  window:{ maxW:3.6, minW:2, sill:0.85, top:3.95, cols:3, rows:2, mull:0.06, frameColor:0x2e2a2c, frameRough:0.42, frameMetal:0.4, railing:false }
};

// Mode capture pour les visuels marketing : /g/<slug>/visite-3d?capture=1
// masque tout l'habillage (titre, boutons, point de visée, aides) et fait
// passer la salle au-dessus des éléments de la page (bandeau d'aperçu, retour).
// ?capture=2 masque aussi les cartels sous les œuvres.
const CAPTURE = (() => {
  const own = new URLSearchParams(location.search).get('capture');
  if(own) return own;
  try{ return new URLSearchParams(window.parent.location.search).get('capture'); }catch(e){ return null; }
})();
if(CAPTURE){
  document.body.classList.add('capture');
  if(CAPTURE === '2') document.body.classList.add('capture-nolabels');
  try{
    const fe = window.frameElement;
    if(fe) fe.style.cssText += ';position:fixed;inset:0;width:100vw;height:100vh;z-index:2147483647;border:0;';
  }catch(e){}
}

/* ---------------------------------------------------------------------- */
/* 1. DONNÉES DES ŒUVRES — remplacées via ?artworks=... ou postMessage    */
/* ---------------------------------------------------------------------- */
// imageUrl 'generated:N' = toile abstraite générée en canvas (pas de dépendance
// réseau). En production, remplacer par de vraies imageUrl (Bubble) : le
// composant charge alors la vraie image via textureLoader normalement.

function parseUrlArtworks(){
  try{
    const p = new URLSearchParams(location.search).get('artworks');
    if(!p) return null;
    return JSON.parse(decodeURIComponent(p));
  }catch(e){ console.warn('artworks param invalide', e); return null; }
}

let artworks = []; // envoyées par la page /g/[slug]/visite-3d (voir section 6)
const urlGalleryName = new URLSearchParams(location.search).get('galleryName');
if(urlGalleryName) document.getElementById('galleryTitle').textContent = urlGalleryName;

/* ---------------------------------------------------------------------- */
/* 2. SCENE / RENDERER                                                     */
/* ---------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0b10);

// Champ de vision proche de l'œil humain : 50° vertical en paysage (pas
// d'effet grand-angle « jeu vidéo ») ; en portrait on garde ~62° horizontal
// pour voir assez de mur, sans dépasser 68° vertical (œuvres assez grandes à l'écran).
function fovFor(aspect){
  if(aspect >= 1) return 50;
  const v = 2*Math.atan(Math.tan(THREE.MathUtils.degToRad(62)/2)/aspect);
  return THREE.MathUtils.clamp(THREE.MathUtils.radToDeg(v), 50, 68);
}
const camera = new THREE.PerspectiveCamera(fovFor(window.innerWidth/window.innerHeight), window.innerWidth/window.innerHeight, 0.05, 100);
camera.position.set(0, 1.65, 4);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position='absolute';
labelRenderer.domElement.style.top='0';
labelRenderer.domElement.style.pointerEvents='none';
document.body.appendChild(labelRenderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.fov = fovFor(camera.aspect);
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

/* Post-traitement : rendu de base + léger bloom sur les spots + passe de sortie
   (obligatoire avec EffectComposer pour retrouver le bon tone mapping/espace
   colorimétrique, sinon l'image sort trop plate). Le bloom est désactivé sur
   tactile pour préserver la fluidité sur mobile ; le rendu reste correct
   (HDRI + matériaux) même sans lui. */
const isTouchDevice = matchMedia('(pointer:coarse)').matches;
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
if(!isTouchDevice){
  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight), 0.28, 0.4, 0.95
  );
  composer.addPass(bloomPass);
}
composer.addPass(new OutputPass());

// Étalonnage « cinéma » : léger S de contraste, chaleur, vignettage doux et
// grain de pellicule animé. Une seule passe plein écran, légère sur mobile.
const gradePass = new ShaderPass({
  uniforms:{ tDiffuse:{ value:null }, uTime:{ value:0 },
    uVign:{ value:0.42 }, uGrain:{ value:0.03 }, uWarm:{ value:0.025 }, uContrast:{ value:1.08 } },
  vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uTime, uVign, uGrain, uWarm, uContrast; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      c = clamp((c - 0.5)*uContrast + 0.5, 0.0, 1.0);
      c = mix(c, c*c*(3.0-2.0*c), 0.18);
      c *= vec3(1.0 + uWarm, 1.0 + uWarm*0.35, 1.0 - uWarm);
      vec2 d = vUv - 0.5; d.x *= 1.15;
      c *= 1.0 - uVign*smoothstep(0.22, 0.82, length(d)*1.35);
      c += (h(vUv*vec2(1733.0,977.0) + fract(uTime*7.3)) - 0.5)*uGrain;
      gl_FragColor = vec4(c, 1.0);
    }`
});
composer.addPass(gradePass);
composer.addPass(new SMAAPass(window.innerWidth, window.innerHeight));

/* ---------------------------------------------------------------------- */
/* 3. LUMIÈRES                                                             */
/* ---------------------------------------------------------------------- */
// Intensités réduites : l'environnement HDRI (ci-dessous) fournit désormais
// l'essentiel de la lumière ambiante et des reflets, ces deux lumières ne
// servent plus qu'à éviter les zones totalement noires.
const hemiLight = new THREE.HemisphereLight(0x6a5560, 0x1a1210, 0.2);
scene.add(hemiLight);
const fill = new THREE.DirectionalLight(0xffe2c4, 0.12);
fill.position.set(2,5,2);
scene.add(fill);


const _fixMat = new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.45, metalness:0.6 });
const _fixLens = new THREE.MeshBasicMaterial({ color:0xfff1d8 });
const _fixCan = new THREE.CylinderGeometry(0.045, 0.038, 0.16, 16, 1, false);
const _fixLensGeo = new THREE.CircleGeometry(0.036, 16);
const _fixStem = new THREE.CylinderGeometry(0.008, 0.008, 1, 6);
const _fixRail = new THREE.BoxGeometry(1, 0.03, 0.045);
let fixtureGroup = null;
function addSpotFixture(pos, tgt){
  if(!fixtureGroup){ fixtureGroup = new THREE.Group(); scene.add(fixtureGroup); }
  const ceilY = pos.y + 0.15;
  const dir = new THREE.Vector3().subVectors(tgt, pos).normalize();
  // rail parallèle au mur éclairé
  const rail = new THREE.Mesh(_fixRail, _fixMat);
  rail.scale.x = 0.9;
  rail.position.set(pos.x, ceilY - 0.016, pos.z);
  rail.rotation.y = Math.atan2(dir.x, dir.z) + Math.PI/2;
  fixtureGroup.add(rail);
  const stem = new THREE.Mesh(_fixStem, _fixMat);
  stem.scale.y = 0.12; stem.position.set(pos.x, ceilY - 0.09, pos.z);
  fixtureGroup.add(stem);
  const can = new THREE.Group();
  const body = new THREE.Mesh(_fixCan, _fixMat); body.rotation.x = Math.PI/2; can.add(body);
  const lens = new THREE.Mesh(_fixLensGeo, _fixLens); lens.position.z = 0.081; can.add(lens);
  can.position.set(pos.x, pos.y, pos.z);
  can.lookAt(tgt);
  fixtureGroup.add(can);
}
let trackSpotIndex = 0;
function addTrackSpot(x,y,z, targetX,targetY,targetZ, opts = {}){
  const spot = new THREE.SpotLight(SKIN.spotColor || 0xfff0d2, 20, opts.distance || 8, opts.angle || Math.PI/6, 0.6, 1.2);
  spot.position.set(x,y,z);
  // Ombres portées réservées à quelques spots (voir MAX_SHADOW_SPOTS) :
  // au-delà, les GPU mobiles refusent le shader (trop de textures d'ombre).
  spot.castShadow = !!opts.shadow;
  trackSpotIndex++;
  spot.shadow.mapSize.set(isTouchDevice ? 512 : 1024, isTouchDevice ? 512 : 1024);
  spot.shadow.radius = 4;
  spot.shadow.bias = -0.0015;
  const target = new THREE.Object3D();
  target.position.set(targetX,targetY,targetZ);
  scene.add(target);
  spot.target = target;
  scene.add(spot);

  // Projecteur sur rail visible au plafond (comme dans une vraie galerie)
  if(true) addSpotFixture(spot.position, target.position);
}

/* ---------------------------------------------------------------------- */
/* 3bis. ENVIRONNEMENT HDRI — éclairage ambiant + reflets réalistes        */
/* ---------------------------------------------------------------------- */
const pmremGenerator = new THREE.PMREMGenerator(renderer);
pmremGenerator.compileEquirectangularShader();

function finishEnvLoad(envTexture){
  if(envTexture){
    scene.environment = envTexture; // n'affecte que l'éclairage/les reflets, pas le décor visible
  } else {
    // Pas de HDRI disponible (réseau restreint, ex. preview) : on compense
    // avec un éclairage direct un peu plus fort pour garder une salle bien exposée.
    hemiLight.intensity = 0.45;
    fill.intensity = 0.22;
  }
  document.getElementById('loading').classList.add('hidden');
}

// Éclairage identique aux maquettes validées : pas d'environnement HDRI.
// L'HDRI (chargé depuis threejs.org) arrivait quelques secondes après
// l'ouverture et éclaircissait brutalement toute la salle.
finishEnvLoad(null);

// filet de sécurité : jamais bloqué plus de 4s sur l'écran de chargement
setTimeout(() => document.getElementById('loading').classList.add('hidden'), 4000);

/* ---------------------------------------------------------------------- */
/* 4. SALLE (murs / sol / plafond) — dimensionnée selon le nb d'œuvres     */
/* ---------------------------------------------------------------------- */
let roomGroup = new THREE.Group();
let roomBounds = { minX:-4, maxX:4, minZ:-4, maxZ:4 };

function makeFloorTexture(){
  // Sol en marbre : nuages de teinte doux + veines qui bifurquent, plus
  // sombre que les murs pour bien trancher, et compatible avec le sol
  // réfléchissant (Reflector) déjà en place.
  const c = document.createElement('canvas'); c.width=768; c.height=768;
  const ctx = c.getContext('2d');
  const W = 768, H = 768;
  ctx.fillStyle = '#34302a'; ctx.fillRect(0,0,W,H);

  // Nuages de teinte — marbre noir façon Nero Marquina, reflets plus clairs
  // qui ressortent fort sur le fond très sombre.
  for(let i=0;i<22;i++){
    const x = Math.random()*W, y = Math.random()*H;
    const r = 80 + Math.random()*160;
    const lighter = Math.random() > 0.5;
    const grad = ctx.createRadialGradient(x,y,0,x,y,r);
    const c1 = lighter ? 'rgba(90,86,78,0.16)' : 'rgba(8,7,6,0.3)';
    grad.addColorStop(0, c1);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }

  // Veines principales, qui bifurquent en veines plus fines
  function drawVein(x0,y0,x1,y1,width,alpha,depth){
    const midx = (x0+x1)/2 + (Math.random()-0.5)*120;
    const midy = (y0+y1)/2 + (Math.random()-0.5)*120;
    ctx.strokeStyle = `rgba(205,198,182,${alpha*1.3})`;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x0,y0);
    ctx.quadraticCurveTo(midx,midy,x1,y1);
    ctx.stroke();
    if(depth > 0 && Math.random() > 0.35){
      const t = 0.3+Math.random()*0.4;
      const bx = x0+(x1-x0)*t, by = y0+(y1-y0)*t;
      const ang = Math.atan2(y1-y0,x1-x0) + (Math.random()-0.5)*1.6;
      const len = 60+Math.random()*140;
      drawVein(bx,by, bx+Math.cos(ang)*len, by+Math.sin(ang)*len, width*0.55, alpha*0.8, depth-1);
    }
  }
  for(let i=0;i<7;i++){
    const x0 = Math.random()*W, y0 = Math.random()*H*0.3;
    const x1 = x0 + (Math.random()-0.5)*300, y1 = y0 + H*0.6 + Math.random()*H*0.3;
    drawVein(x0,y0,x1,y1, 1.6+Math.random()*1.8, 0.22+Math.random()*0.12, 2);
  }

  // Grain fin pour casser l'effet trop numérique
  for(let i=0;i<1200;i++){
    const shade = 95 + Math.random()*50;
    ctx.fillStyle = `rgba(${shade},${shade-4},${shade-10},${0.015+Math.random()*0.04})`;
    ctx.beginPath();
    ctx.arc(Math.random()*W, Math.random()*H, 0.8+Math.random()*1.8, 0, Math.PI*2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const floorTex = makeFloorTexture();

function makeBumpTexture({ base=128, grain=16, blobs=0, blobColor=null } = {}){
  // Texture de relief en niveaux de gris (utilisée comme bumpMap) : grain fin
  // + éventuellement quelques variations plus larges (imperfections de plâtre).
  const c = document.createElement('canvas'); c.width=512; c.height=512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = `rgb(${base},${base},${base})`; ctx.fillRect(0,0,512,512);
  for(let i=0;i<32000;i++){
    const shade = base + (Math.random()-0.5)*grain;
    ctx.fillStyle = `rgb(${shade},${shade},${shade})`;
    ctx.fillRect(Math.random()*512, Math.random()*512, 1, 1);
  }
  for(let i=0;i<blobs;i++){
    const shade = base + (Math.random()-0.5)*grain*1.8;
    ctx.fillStyle = `rgba(${shade},${shade},${shade},0.35)`;
    ctx.beginPath();
    ctx.arc(Math.random()*512, Math.random()*512, 6+Math.random()*22, 0, Math.PI*2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
function makeWoodAccentTexture(){
  // Mur d'accent en lattes de bois verticales séparées par de fines rainures
  // sombres. Texture haute définition, filtrage anisotrope et veinage doux
  // (pas de traits d'1 pixel) : pas de scintillement quand on tourne la tête.
  // Une tuile = 1,2 m de large, 8 lattes de 15 cm.
  const W = SKIN.accentWood || { base:96, spread:24, g:0.66, b:0.45, groove:'#140c07' };
  const S = 1024, slats = 8, sw = S/slats, gap = 10;
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  const ctx = c.getContext('2d');
  let seed = 23;
  const rnd = () => { seed = (seed*16807) % 2147483647; return (seed - 1)/2147483646; };
  ctx.fillStyle = W.groove; ctx.fillRect(0, 0, S, S);
  for(let i = 0; i < slats; i++){
    const x0 = i*sw + gap/2, w = sw - gap;
    const base = W.base + (rnd() - 0.5)*W.spread;
    const g = ctx.createLinearGradient(x0, 0, x0 + w, 0);
    const col = (k) => `rgb(${(base*k)|0},${(base*W.g*k)|0},${(base*W.b*k)|0})`;
    g.addColorStop(0, col(0.88)); g.addColorStop(0.5, col(1.04)); g.addColorStop(1, col(0.88));
    ctx.fillStyle = g; ctx.fillRect(x0, 0, w, S);
    // Veinage dans le sens de la latte : traits larges et très transparents
    for(let k = 0; k < 14; k++){
      const gx = x0 + 6 + rnd()*(w - 12), amp = 3 + rnd()*7, ph = rnd()*6;
      ctx.strokeStyle = `rgba(0,0,0,${0.035 + rnd()*0.05})`;
      ctx.lineWidth = 2 + rnd()*3;
      ctx.beginPath();
      for(let y = 0; y <= S; y += 32){
        const xx = gx + Math.sin(y/140 + ph)*amp;
        if(y === 0) ctx.moveTo(xx, y); else ctx.lineTo(xx, y);
      }
      ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// Plâtre peint réaliste : bruit fractal doux (ondulations de l'enduit),
// passes de taloche, petites piqûres et reprises. Trois textures 1024 px
// générées une fois : relief (bumpMap), nuances de teinte (map) et
// variations de brillance (roughnessMap). Tuile de 3 m, sans couture.
function makePlasterTextures(kind){
  const S = 1024;
  let seed = 101;
  const rnd = () => { seed = (seed*16807) % 2147483647; return (seed - 1)/2147483646; };
  // bruit de valeur périodique (raccord sans couture)
  const grid = (n) => { const g = new Float32Array(n*n); for(let i=0;i<n*n;i++) g[i] = rnd(); return g; };
  const octs = [4, 8, 16, 32, 64, 128].map(n => ({ n, g: grid(n) }));
  const sm = t => t*t*(3-2*t);
  const val = (o, x, y) => {
    const n = o.n, fx = x*n, fy = y*n;
    const x0 = Math.floor(fx), y0 = Math.floor(fy), tx = sm(fx - x0), ty = sm(fy - y0);
    const g = o.g, i = (a, b) => g[((b % n + n) % n)*n + ((a % n + n) % n)];
    const a = i(x0,y0) + (i(x0+1,y0) - i(x0,y0))*tx;
    const b = i(x0,y0+1) + (i(x0+1,y0+1) - i(x0,y0+1))*tx;
    return a + (b - a)*ty;
  };
  const wH = [0.34, 0.24, 0.16, 0.12, 0.08, 0.06], wT = [0.5, 0.3, 0.12, 0.05, 0.03, 0];
  const R = 256; // calcul en basse définition puis interpolation (rapide)
  const lowH = new Float32Array(R*R), lowT = new Float32Array(R*R);
  for(let y=0;y<R;y++) for(let x=0;x<R;x++){
    let h = 0, t = 0;
    for(let k=0;k<octs.length;k++){ const v = val(octs[k], x/R, y/R); h += v*wH[k]; t += v*wT[k]; }
    lowH[y*R+x] = h; lowT[y*R+x] = t;
  }
  const c = document.createElement('canvas'); c.width = c.height = S;
  const ctx = c.getContext('2d');
  // relief : image basse déf. agrandie (lisse) + grain fin + taloche
  const lc = document.createElement('canvas'); lc.width = lc.height = R;
  const lctx = lc.getContext('2d'), li = lctx.createImageData(R, R);
  for(let i=0;i<R*R;i++){ const v = Math.max(0, Math.min(255, (lowH[i]-0.5)*420 + 128)); li.data[i*4]=li.data[i*4+1]=li.data[i*4+2]=v; li.data[i*4+3]=255; }
  lctx.putImageData(li, 0, 0);
  ctx.imageSmoothingEnabled = true;
  for(const dx of [-S, 0, S]) for(const dy of [-S, 0, S]) ctx.drawImage(lc, dx, dy, S, S);
  // passes de taloche : arcs larges et très doux, dupliqués aux bords
  ctx.lineCap = 'round';
  for(let i=0;i<70;i++){
    const x = rnd()*S, y = rnd()*S, r = 60 + rnd()*160, a0 = rnd()*6.28, a1 = a0 + 0.6 + rnd()*1.2;
    const light = rnd() > 0.5;
    ctx.strokeStyle = light ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.07)';
    ctx.lineWidth = 10 + rnd()*26;
    for(const dx of [-S, 0, S]) for(const dy of [-S, 0, S]){
      ctx.beginPath(); ctx.arc(x+dx, y+dy, r, a0, a1); ctx.stroke();
    }
  }
  const img = ctx.getImageData(0, 0, S, S), d = img.data;
  for(let i=0;i<S*S;i++){
    let v = d[i*4] + (rnd() - 0.5)*18;               // grain de l'enduit
    if(rnd() < 0.0009) v -= 40 + rnd()*40;           // piqûres
    v = Math.max(0, Math.min(255, v));
    d[i*4] = d[i*4+1] = d[i*4+2] = v;
  }
  ctx.putImageData(img, 0, 0);
  const bump = new THREE.CanvasTexture(c);
  bump.wrapS = bump.wrapT = THREE.RepeatWrapping; bump.anisotropy = 4;

  // teinte : nuances très légères (reprises de peinture), autour du blanc
  const cc = document.createElement('canvas'); cc.width = cc.height = R;
  const cx = cc.getContext('2d'), ci = cx.createImageData(R, R);
  const amp = kind === 'dark' ? 34 : 22;
  for(let i=0;i<R*R;i++){
    const t = (lowT[i] - 0.5);
    const v = 236 + t*amp, w = (lowH[i]-0.5)*6;
    ci.data[i*4]   = Math.min(255, v + 4 + w);
    ci.data[i*4+1] = Math.min(255, v + 2 + w);
    ci.data[i*4+2] = Math.min(255, v - 1 + w);
    ci.data[i*4+3] = 255;
  }
  cx.putImageData(ci, 0, 0);
  const color = new THREE.CanvasTexture(cc);
  color.colorSpace = THREE.SRGBColorSpace;
  color.wrapS = color.wrapT = THREE.RepeatWrapping;

  // brillance : les zones lissées par la taloche brillent un peu plus
  const rc = document.createElement('canvas'); rc.width = rc.height = R;
  const rx = rc.getContext('2d'), ri = rx.createImageData(R, R);
  for(let i=0;i<R*R;i++){ const v = 215 + (lowT[i]-0.5)*-90; ri.data[i*4]=ri.data[i*4+1]=ri.data[i*4+2]=v; ri.data[i*4+3]=255; }
  rx.putImageData(ri, 0, 0);
  const rough = new THREE.CanvasTexture(rc);
  rough.wrapS = rough.wrapT = THREE.RepeatWrapping;
  return { bump, color, rough };
}
const PLASTER = makePlasterTextures('dark');
const wallBumpTex = PLASTER.bump;
const wallRoughTex = PLASTER.rough;
const wallColorTex = PLASTER.color;
const floorBumpTex = makeBumpTexture({ base:128, grain:22, blobs:0 });

/* --- Grandes galeries : plan de la salle, accrochage sur tous les murs ---
   La salle est découpée en "pans de mur" (mur du fond, murs latéraux, faces
   des piliers, faces de la cloison, deuxième salle). Les œuvres sont réparties
   sur ces pans, du plus visible au plus discret ; si la place manque, la
   salle s'agrandit en largeur ET en profondeur (jamais un couloir). */
const FRAME_BORDER = 0.06;
const GAP = 0.9;      // mur libre minimal entre deux cadres (m)
const PT = 0.9;       // épaisseur de la cloison à passage
const TH = 1.3;       // épaisseur des piliers
// Plafond de lumières : au-delà, les œuvres voisines partagent un spot
// (fluidité sur mobile, et limite d'ombres portées supportée par les GPU).
const MAX_SPOTS = isTouchDevice ? 12 : 34;
const MAX_SHADOW_SPOTS = isTouchDevice ? 2 : 4;

let roomGeo = null;    // plan de la salle courante
let occluders = [];    // piliers/cloisons : masquent les cartels et la sélection

function artSize(a){
  const w = Math.max(0.25, (a.widthCm||60)/100);
  const h = Math.max(0.25, (a.heightCm||45)/100);
  return { w, h, fw: w + FRAME_BORDER*2, fh: h + FRAME_BORDER*2 };
}
// Hauteur du centre de l'œuvre : 1,55 m (standard musée), relevée pour les
// très grands formats afin de garder un dégagement au sol (cimaise en Haussmann).
function centerY(fh){ return Math.max(1.55, SKIN.minBottom + fh/2); }

function roomGeometry(W, D, H){
  const W2 = W/2, D2 = D/2;
  const zone2Depth = THREE.MathUtils.clamp(D*0.2, 3, 6);
  const doorZ = D2 - zone2Depth;
  const zP1 = doorZ - PT/2, zP2 = doorZ + PT/2;
  const mainLen = zP1 + D2;
  const zL = -D2 + mainLen*0.27, zR = -D2 + mainLen*0.62;
  const reach = Math.min(W*0.4, 3.2);
  const doorHalf = Math.min(2.2, W*0.24);
  const doorTop = H*0.68;

  let win = null;
  const zFreeA = zL + TH/2, zFreeB = zP1;
  const winW = Math.min(SKIN.window.maxW, (zFreeB - zFreeA) - 3.4);
  if(winW >= SKIN.window.minW){
    const zc = (zFreeA + zFreeB)/2;
    win = { zc, zA: zc - winW/2, zB: zc + winW/2, winW };
  }

  const faces = [];
  function face(id, ax, az, bx, bz, nx, nz, tier, opts = {}){
    const len = Math.hypot(bx-ax, bz-az);
    if(len < 0.3) return;
    const margin = len < 2.2 ? 0.2 : 0.5;
    faces.push({
      id, a:{ x:ax, z:az }, dir:{ x:(bx-ax)/len, z:(bz-az)/len }, n:{ x:nx, z:nz },
      len, tier, margin, usable: len - 2*margin,
      hang: opts.hang !== false && len - 2*margin >= 0.45,
      corniceOnly: !!opts.corniceOnly
    });
  }
  // Ordre = priorité d'accrochage (le mur du fond reçoit les premières œuvres)
  face('back', -W2,-D2, W2,-D2, 0,1, 0);
  face('leftA', -W2,-D2, -W2,zL-TH/2, 1,0, 0);
  face('rightA', W2,-D2, W2,zR-TH/2, -1,0, 0);
  face('partFrontL', -W2,zP1, -doorHalf,zP1, 0,-1, 1);
  face('partFrontR', doorHalf,zP1, W2,zP1, 0,-1, 1);
  face('rightB', W2,zR+TH/2, W2,zP1, -1,0, 1);
  if(win){
    face('leftB1', -W2,zFreeA, -W2,win.zA-0.4, 1,0, 1);
    face('leftB2', -W2,win.zB+0.4, -W2,zP1, 1,0, 1);
    face('window', -W2,win.zA-0.4, -W2,win.zB+0.4, 1,0, 9, { hang:false, corniceOnly:true });
  } else {
    face('leftB', -W2,zFreeA, -W2,zP1, 1,0, 1);
  }
  face('front', -W2,D2, W2,D2, 0,-1, 1);
  face('pillarL-back', -W2,zL-TH/2, -W2+reach,zL-TH/2, 0,-1, 2);
  face('pillarL-front', -W2,zL+TH/2, -W2+reach,zL+TH/2, 0,1, 2);
  face('pillarR-back', W2-reach,zR-TH/2, W2,zR-TH/2, 0,-1, 2);
  face('pillarR-front', W2-reach,zR+TH/2, W2,zR+TH/2, 0,1, 2);
  face('partBackL', -W2,zP2, -doorHalf,zP2, 0,1, 2);
  face('partBackR', doorHalf,zP2, W2,zP2, 0,1, 2);
  face('z2Left', -W2,zP2, -W2,D2, 1,0, 2);
  face('z2Right', W2,zP2, W2,D2, -1,0, 2);
  face('pillarL-end', -W2+reach,zL-TH/2, -W2+reach,zL+TH/2, 1,0, 3);
  face('pillarR-end', W2-reach,zR-TH/2, W2-reach,zR+TH/2, -1,0, 3);
  // Pans décoratifs uniquement (moulures), jamais d'œuvre
  face('jambL', -doorHalf,zP1, -doorHalf,zP2, 1,0, 9, { hang:false });
  face('jambR', doorHalf,zP1, doorHalf,zP2, -1,0, 9, { hang:false });
  face('lintelFront', -doorHalf,zP1, doorHalf,zP1, 0,-1, 9, { hang:false, corniceOnly:true });
  face('lintelBack', -doorHalf,zP2, doorHalf,zP2, 0,1, 9, { hang:false, corniceOnly:true });

  const solids = [
    { minX:-W2, maxX:-W2+reach, minZ:zL-TH/2, maxZ:zL+TH/2 },
    { minX:W2-reach, maxX:W2, minZ:zR-TH/2, maxZ:zR+TH/2 },
    { minX:-W2, maxX:-doorHalf, minZ:zP1, maxZ:zP2 },
    { minX:doorHalf, maxX:W2, minZ:zP1, maxZ:zP2 },
  ];
  return { W, D, H, W2, D2, zone2Depth, doorZ, zP1, zP2, zL, zR, reach, doorHalf, doorTop, win,
           faces, solids, mainLen, zMainC:(-D2 + zP1)/2, zZone2C:(zP2 + D2)/2 };
}

// Répartit les œuvres sur les pans actifs : chaque pan reçoit une part
// proportionnelle à sa longueur (accrochage homogène), dans l'ordre des œuvres.
function assignArtworks(items, active, ratio, force){
  const segs = active.map(f => ({ f, items:[], used:0, budget: ratio*1.15*(f.usable + GAP) }));
  const queue = items.slice();
  for(const s of segs){
    for(;;){
      const gapAdd = s.items.length ? GAP : 0;
      const idx = queue.findIndex(it => s.used + gapAdd + it.fw <= s.f.usable + 1e-6);
      if(idx < 0) break;
      const it = queue[idx];
      if(s.used + gapAdd + it.fw/2 > s.budget) break;
      s.items.push(it); queue.splice(idx, 1); s.used += gapAdd + it.fw;
    }
  }
  for(const it of queue){
    let best = null, bestFree = -Infinity;
    for(const s of segs){
      const free = s.f.usable - s.used - it.fw - (s.items.length ? GAP : 0);
      if(free >= -1e-6 && free > bestFree){ best = s; bestFree = free; }
    }
    if(!best){
      if(!force || !segs.length) return null;
      best = segs[0];
    }
    best.used += it.fw + (best.items.length ? GAP : 0);
    best.items.push(it);
  }
  return segs.filter(s => s.items.length);
}

function planLayout(items){
  const maxTop = items.reduce((m, it) => Math.max(m, centerY(it.fh) + it.fh/2), 0);
  const H = Math.max(5.6, maxTop + 1.6);
  const need = items.reduce((s, it) => s + it.fw + GAP, 0);
  let geo = null;
  for(let k = 0; k <= 24; k++){
    geo = roomGeometry(10 + 2*k, 15 + 1.5*k, H);
    const hangable = geo.faces.filter(f => f.hang);
    for(let tier = 0; tier <= 3; tier++){
      const active = hangable.filter(f => f.tier <= tier);
      const cap = active.reduce((s, f) => s + f.usable + GAP, 0);
      // On garde de l'air : un pan n'est jamais rempli bord à bord
      if(need > cap*(tier < 3 ? 0.7 : 0.85)) continue;
      const segs = assignArtworks(items, active, cap ? need/cap : 0, false);
      if(segs) return { geo, segs };
    }
  }
  return { geo, segs: assignArtworks(items, geo.faces.filter(f => f.hang), 1, true) || [] };
}

function computeSlots(geo, segs){
  const slots = [];
  segs.forEach(s => {
    const f = s.f, n = s.items.length;
    const total = s.items.reduce((a, it) => a + it.fw, 0);
    const g = n > 1 ? Math.max(GAP, Math.min((f.usable - total)/(n + 1), 2.4)) : 0;
    const groupLen = total + g*(n - 1);
    let cursor = f.margin + (f.usable - groupLen)/2;
    s.slots = s.items.map(it => {
      const along = cursor + it.fw/2;
      cursor += it.fw + g;
      const x = f.a.x + f.dir.x*along + f.n.x*0.06;
      const z = f.a.z + f.dir.z*along + f.n.z*0.06;
      const slot = { it, face:f, along, x, z, y:centerY(it.fh), n:f.n,
                     rotY: Math.atan2(f.n.x, f.n.z), fw:it.fw, fh:it.fh };
      slots.push(slot);
      return slot;
    });
  });
  return slots;
}

// Ordre de visite : tour de la grande salle dans le sens des aiguilles d'une
// montre en partant du coin du fond à gauche, puis tour de la deuxième salle.
function tourKey(geo, s){
  const TWO_PI = Math.PI*2;
  const mod = v => ((v % TWO_PI) + TWO_PI) % TWO_PI;
  if(s.z < geo.doorZ){
    const zc = geo.zMainC;
    const ang = (x, z) => Math.atan2(x, -(z - zc));
    return mod(ang(s.x, s.z) - ang(-geo.W2, -geo.D2) + 1e-3);
  }
  const zc = geo.zZone2C;
  const ang = (x, z) => Math.atan2(-x, z - zc);
  return 10 + mod(ang(s.x, s.z) - ang(geo.W2, geo.zP2) + 1e-3);
}

// Distance libre (m) devant un point du mur, dans la direction n
function freeAlong(px, pz, nx, nz, max){
  const b = roomBounds;
  let last = 0.3;
  for(let t = 0.3; t <= max + 1e-6; t += 0.1){
    const x = px + nx*t, z = pz + nz*t;
    if(x < -b.W2+0.2 || x > b.W2-0.2 || z < -b.D2+0.2 || z > b.D2-0.2) break;
    if(b.solids.some(s => x > s.minX && x < s.maxX && z > s.minZ && z < s.maxZ)) break;
    last = t;
  }
  return last;
}

function placeSpots(geo, segs, spotBudget, shadowBudget){
  const total = segs.reduce((a, s) => a + s.slots.length, 0);
  if(!total) return [];
  spotBudget = Math.max(1, spotBudget);
  let g = Math.max(1, Math.ceil(total / spotBudget));
  const count = gg => segs.reduce((a, s) => a + Math.ceil(s.slots.length/gg), 0);
  while(count(g) > spotBudget && g < 3) g++;   // au plus 3 œuvres sous un même spot
  const groups = [];
  segs.forEach(s => { for(let i = 0; i < s.slots.length; i += g) groups.push({ s, grp: s.slots.slice(i, i + g) }); });
  // Plafond atteint (beaucoup de petits pans) : les pans les plus discrets
  // n'ont pas de spot ; leurs œuvres recevront un léger éclat propre.
  const unlit = [];
  groups.slice(spotBudget).forEach(G => unlit.push(...G.grp));
  groups.slice(0, spotBudget).forEach((G, idx) => {
    const n = G.s.f.n, grp = G.grp;
    const first = grp[0], last = grp[grp.length - 1];
    const cx = (first.x + last.x)/2, cz = (first.z + last.z)/2;
    const span = Math.abs(last.along - first.along) + (first.fw + last.fw)/2;
    const ty = grp.reduce((a, sl) => a + sl.y, 0)/grp.length;
    const maxH = Math.max(...grp.map(sl => sl.fh));
    const off = Math.min(1.4, Math.max(0.5, freeAlong(cx, cz, n.x, n.z, 1.4)));
    const sy = geo.H - 0.15;
    const d = Math.hypot(off, sy - ty);
    const half = Math.max(span, maxH)/2 + 0.35;
    const angle = THREE.MathUtils.clamp(Math.atan(half/d)*1.15, Math.PI/6, Math.PI/3);
    addTrackSpot(cx + n.x*off, sy, cz + n.z*off, cx, ty, cz,
                 { angle, distance: Math.max(8, d*2), shadow: idx < shadowBudget });
  });
  return unlit;
}

/* ---------- Haussmann : parquet point de Hongrie ---------- */
let _parquetTex = null;
function parquetTexture(){
  if(_parquetTex) return _parquetTex;
  // 4 colonnes de lames inclinées à 45°, alternées pour former les chevrons.
  // Une tuile = 1,8 m ; couleurs fixées par lame pour un raccord sans couture.
  const PQ = Object.assign({ base:150, spread:42, g:0.7, b:0.43, bg:'#7a5532', grain:'70,40,18', joint:'45,26,12' }, SKIN.parquet || {});
  const S = 1024, cols = 4, cw = S/cols, ph = 64, rowsN = S/ph;
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  const ctx = c.getContext('2d');
  let seed = 7;
  const rnd = () => { seed = (seed*16807) % 2147483647; return (seed - 1)/2147483646; };
  const tones = [];
  for(let col = 0; col < cols; col++){
    tones.push([]);
    for(let r = 0; r < rowsN; r++){
      tones[col].push({ base: PQ.base + rnd()*PQ.spread, grains: Array.from({ length:7 }, () => [rnd(), rnd()]) });
    }
  }
  ctx.fillStyle = PQ.bg; ctx.fillRect(0, 0, S, S);
  for(let col = 0; col < cols; col++){
    const x0 = col*cw, up = col % 2 === 0;
    const lineY = (x, y0) => y0 + (up ? (x - x0) : (x0 + cw - x));
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, 0, cw, S); ctx.clip();
    for(let i = -6; i < rowsN + 6; i++){
      const t = tones[col][((i % rowsN) + rowsN) % rowsN];
      const y0 = i*ph;
      const r = t.base, g = r*PQ.g, b = r*PQ.b;
      ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
      ctx.beginPath();
      ctx.moveTo(x0, lineY(x0, y0)); ctx.lineTo(x0 + cw, lineY(x0 + cw, y0));
      ctx.lineTo(x0 + cw, lineY(x0 + cw, y0) + ph); ctx.lineTo(x0, lineY(x0, y0) + ph);
      ctx.closePath(); ctx.fill();
      // veinage parallèle à la lame
      t.grains.forEach(([o, a]) => {
        ctx.strokeStyle = `rgba(${PQ.grain},${0.05 + a*0.12})`;
        ctx.lineWidth = 1 + a;
        ctx.beginPath();
        ctx.moveTo(x0, lineY(x0, y0) + o*ph);
        ctx.lineTo(x0 + cw, lineY(x0 + cw, y0) + o*ph + (a - 0.5)*6);
        ctx.stroke();
      });
      // joint entre deux lames
      ctx.strokeStyle = `rgba(${PQ.joint},0.55)`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x0, lineY(x0, y0)); ctx.lineTo(x0 + cw, lineY(x0 + cw, y0)); ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = `rgba(${PQ.joint},0.6)`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x0 + 1, 0); ctx.lineTo(x0 + 1, S); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  _parquetTex = tex;
  return tex;
}

/* ---------- Parquet à lames droites (salle blanche) ---------- */
let _plankTex = null;
function plankTexture(){
  if(_plankTex) return _plankTex;
  // Lames larges posées à joints décalés. Une tuile = 2,4 m (12 rangées de
  // 20 cm) ; les lames qui dépassent du bord sont redessinées de l'autre côté
  // pour un raccord sans couture.
  const P = Object.assign({ base:188, spread:30, g:0.82, b:0.62, grain:'90,62,36', joint:'70,48,28' }, SKIN.planks || {});
  const S = 1024, rows = 12, rh = S/rows;
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  const ctx = c.getContext('2d');
  let seed = 11;
  const rnd = () => { seed = (seed*16807) % 2147483647; return (seed - 1)/2147483646; };
  for(let r = 0; r < rows; r++){
    const y0 = r*rh;
    // Lames couvrant exactement [x0, x0 + S) : chaque lame est dessinée à sa
    // place et décalée de -S, ce qui raccorde la tuile sans chevauchement.
    const x0 = rnd()*S, end = x0 + S;
    const lens = [];
    let acc = 0;
    while(acc < S){
      let l = S*(0.32 + rnd()*0.38);
      if(S - acc - l < S*0.18) l = S - acc;
      lens.push(l); acc += l;
    }
    let x = x0;
    for(const len of lens){
      const base = P.base + (rnd() - 0.5)*P.spread;
      const col = `rgb(${base|0},${(base*P.g)|0},${(base*P.b)|0})`;
      const grains = Array.from({ length:9 }, () => [rnd(), rnd(), rnd()]);
      [x, x - S].forEach(px => {
        if(px + len < 0 || px > S) return;
        ctx.fillStyle = col; ctx.fillRect(px, y0, len, rh);
        grains.forEach(([o, a, w]) => {
          ctx.strokeStyle = `rgba(${P.grain},${0.05 + a*0.1})`;
          ctx.lineWidth = 0.6 + a*1.4;
          ctx.beginPath();
          const gy = y0 + 4 + o*(rh - 8);
          ctx.moveTo(px, gy);
          ctx.bezierCurveTo(px + len*0.33, gy + (w - 0.5)*6, px + len*0.66, gy - (w - 0.5)*6, px + len, gy + (a - 0.5)*3);
          ctx.stroke();
        });
        ctx.strokeStyle = `rgba(${P.joint},0.5)`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(px + len, y0); ctx.lineTo(px + len, y0 + rh); ctx.stroke();
      });
      x += len;
    }
    ctx.strokeStyle = `rgba(${P.joint},0.45)`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, y0 + 1); ctx.lineTo(S, y0 + 1); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  _plankTex = tex;
  return tex;
}

/* ---------- Marbre poli (salles sombre et blanche) ---------- */
let _marbleTex = null;
function marbleTexture(){
  if(_marbleTex) return _marbleTex;
  // Une tuile = 2 x 2 grandes dalles (2,4 m). Tout est dessiné aussi décalé
  // d'une tuile dans chaque direction : raccord sans couture. Les flous sont
  // appliqués une seule fois par calque (rapide, même sur mobile).
  const M = Object.assign({
    base:'#e9e2d4', cloudDark:'170,158,140', cloudLight:'255,252,246',
    vein:'128,116,100', veinAccent:'176,146,92', joint:'120,108,92', jointA:0.18
  }, SKIN.marble || {});
  const S = 1024, P = 48;
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  const ctx = c.getContext('2d');
  let seed = 23;
  const rnd = () => { seed = (seed*16807) % 2147483647; return (seed - 1)/2147483646; };
  // Calque avec marge : le flou « voit » le motif voisin, donc pas de couture.
  const layer = (draw, blur) => {
    const L = document.createElement('canvas'); L.width = L.height = S + 2*P;
    const g = L.getContext('2d');
    g.lineCap = 'round'; g.lineJoin = 'round';
    for(const ox of [-S, 0, S]) for(const oy of [-S, 0, S]){ g.save(); g.translate(P + ox, P + oy); draw(g); g.restore(); }
    if(blur && 'filter' in ctx) ctx.filter = `blur(${blur}px)`;
    ctx.drawImage(L, -P, -P);
    ctx.filter = 'none';
  };
  ctx.fillStyle = M.base; ctx.fillRect(0, 0, S, S);
  // Nuages : variations douces de teinte dans la pierre
  const clouds = Array.from({ length:60 }, () => [rnd()*S, rnd()*S, S*(0.06 + rnd()*0.22), rnd() < 0.55 ? M.cloudDark : M.cloudLight, 0.03 + rnd()*0.07]);
  layer(g => clouds.forEach(([x, y, r, col, a]) => {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
  }), 0);
  // Courants larges très diffus (le « mouvement » de la pierre)
  const drifts = Array.from({ length:5 }, () => [rnd()*S, rnd()*S, 0.6 + (rnd() - 0.5)*0.5, (rnd() - 0.5)*S*0.3, (rnd() - 0.5)*S*0.3]);
  layer(g => drifts.forEach(([x, y, ang, dx, dy]) => {
    g.strokeStyle = `rgba(${M.vein},0.07)`; g.lineWidth = S*0.07;
    g.beginPath(); g.moveTo(x - Math.cos(ang)*S*0.7, y - Math.sin(ang)*S*0.7);
    g.quadraticCurveTo(x + dx, y + dy, x + Math.cos(ang)*S*0.7, y + Math.sin(ang)*S*0.7); g.stroke();
  }), 24);
  // Veines : tracés souples en diagonale, épaisseur variable, rares ramifications
  const veins = [];
  const vein = (x, y, ang, steps, w, a, col, depth) => {
    const pts = [[x, y]]; let turn = 0;
    for(let s = 0; s < steps; s++){
      turn = turn*0.85 + (rnd() - 0.5)*0.12; ang += turn;
      x += Math.cos(ang)*S*0.011; y += Math.sin(ang)*S*0.011; pts.push([x, y]);
      if(depth < 1 && rnd() < 0.025) vein(x, y, ang + (rnd() < 0.5 ? 0.5 : -0.5), 12 + (rnd()*25|0), w*0.45, a*0.7, col, depth + 1);
    }
    veins.push({ pts, w, a, col });
  };
  for(let v = 0; v < 7; v++){
    vein(rnd()*S, rnd()*S, 0.6 + (rnd() - 0.5)*0.6, 70 + (rnd()*60|0),
         1.2 + rnd()*1.8, 0.35 + rnd()*0.3, v === 3 ? M.veinAccent : M.vein, 0);
  }
  const strokePath = (g, pts) => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for(let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.stroke(); };
  // voile flou autour des veines
  layer(g => veins.forEach(({ pts, w, a, col }) => { g.strokeStyle = `rgba(${col},${a*0.25})`; g.lineWidth = w*9; strokePath(g, pts); }), 6);
  // fil principal, légèrement adouci
  layer(g => veins.forEach(({ pts, w, a, col }) => {
    for(let i = 1; i < pts.length; i++){
      const k = 0.55 + 0.45*Math.sin(i*0.35 + w*3);
      g.strokeStyle = `rgba(${col},${a*k})`; g.lineWidth = w*(0.6 + k*0.8);
      g.beginPath(); g.moveTo(pts[i-1][0], pts[i-1][1]); g.lineTo(pts[i][0], pts[i][1]); g.stroke();
    }
  }), 0.8);
  // Joints des dalles, très discrets
  ctx.strokeStyle = `rgba(${M.joint},${M.jointA})`; ctx.lineWidth = 2;
  [1, S/2].forEach(p => {
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(S, p); ctx.stroke();
  });
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  _marbleTex = tex;
  return tex;
}

/* ---------- Moulures : plinthes (toutes salles) + corniche, cimaise et
   boiseries (Haussmann). Une seule InstancedMesh pour toute la salle. ---------- */
function addMoldings(geo){
  const hs = !!SKIN.haussmann;
  const strips = []; // [face, s0, s1, yCentre, hauteur, saillie, pleineLongueur]
  geo.faces.forEach(f => {
    if(!f.corniceOnly) strips.push([f, 0, f.len, hs ? 0.08 : 0.045, hs ? 0.16 : 0.09, hs ? 0.025 : 0.03, true]);
    if(!hs) return;
    strips.push([f, 0, f.len, geo.H - 0.07, 0.14, 0.12, true]);
    strips.push([f, 0, f.len, geo.H - 0.19, 0.06, 0.075, true]);
    strips.push([f, 0, f.len, geo.H - 0.26, 0.04, 0.04, true]);
    if(f.corniceOnly) return;
    strips.push([f, 0, f.len, 0.9, 0.05, 0.035, true]);   // cimaise
    const inset = 0.16, pg = 0.12, usable = f.len - 2*inset;
    if(usable > 0.5){
      const n = Math.max(1, Math.round(usable/1.25));
      const pw = (usable - (n - 1)*pg)/n;
      const y0 = 0.26, y1 = 0.76, t = 0.03, d = 0.016;
      for(let i = 0; i < n; i++){
        const a = inset + i*(pw + pg), b = a + pw;
        strips.push([f, a, b, y1 - t/2, t, d, false]);
        strips.push([f, a, b, y0 + t/2, t, d, false]);
        strips.push([f, a, a + t, (y0 + y1)/2, y1 - y0, d, false]);
        strips.push([f, b - t, b, (y0 + y1)/2, y1 - y0, d, false]);
      }
    }
  });
  const mat = new THREE.MeshStandardMaterial({ color: hs ? 0xf6f0e4 : SKIN.plinthColor, roughness: hs ? 0.8 : (SKIN.plinthRough || 0.6) });
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), mat, strips.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0);
  strips.forEach(([f, s0, s1, y, h, d, full], i) => {
    // Les profils pleine longueur débordent de leur saillie : angles fermés
    const a0 = full ? s0 - d : s0, a1 = full ? s1 + d : s1, mid = (a0 + a1)/2;
    p.set(f.a.x + f.dir.x*mid + f.n.x*d/2, y, f.a.z + f.dir.z*mid + f.n.z*d/2);
    q.setFromAxisAngle(up, Math.atan2(f.n.x, f.n.z));
    sc.set(a1 - a0, h, d);
    mesh.setMatrixAt(i, m4.compose(p, q, sc));
  });
  mesh.receiveShadow = true;
  roomGroup.add(mesh);
}

/* ---------- Haussmann : lustre en laiton ---------- */
function addChandelier(x, z, H){
  const g = new THREE.Group();
  const brass = new THREE.MeshStandardMaterial({ color:0xc9a24a, metalness:0.55, roughness:0.32 });
  const add = (geom, mat, px, py, pz) => { const m = new THREE.Mesh(geom, mat); m.position.set(px, py, pz); g.add(m); return m; };
  const drop = 1.2, yb = H - drop;
  add(new THREE.CylinderGeometry(0.2, 0.26, 0.05, 32), new THREE.MeshStandardMaterial({ color:0xf6f0e4, roughness:0.8 }), 0, H - 0.025, 0); // rosace
  add(new THREE.CylinderGeometry(0.012, 0.012, drop - 0.1, 8), brass, 0, H - (drop - 0.1)/2, 0);
  add(new THREE.SphereGeometry(0.11, 24, 16), brass, 0, yb, 0);
  add(new THREE.ConeGeometry(0.05, 0.2, 16), brass, 0, yb - 0.19, 0).rotation.x = Math.PI;
  const ring = add(new THREE.TorusGeometry(0.5, 0.014, 8, 48), brass, 0, yb - 0.02, 0);
  ring.rotation.x = Math.PI/2;
  const candleMat = new THREE.MeshStandardMaterial({ color:0xf7f1e3, roughness:0.6 });
  const bulbMat = new THREE.MeshStandardMaterial({ color:0xfff2d8, emissive:0xffcf8a, emissiveIntensity:2.2 });
  const armGeo = new THREE.CylinderGeometry(0.01, 0.01, 0.5, 6);
  for(let i = 0; i < 8; i++){
    const a = i/8*Math.PI*2, cx = Math.cos(a)*0.5, cz = Math.sin(a)*0.5;
    const arm = add(armGeo, brass, Math.cos(a)*0.25, yb, Math.sin(a)*0.25);
    arm.rotation.z = Math.PI/2; arm.rotation.y = -a;
    add(new THREE.CylinderGeometry(0.035, 0.025, 0.04, 12), brass, cx, yb + 0.01, cz);
    add(new THREE.CylinderGeometry(0.014, 0.014, 0.12, 8), candleMat, cx, yb + 0.09, cz);
    add(new THREE.SphereGeometry(0.028, 12, 8), bulbMat, cx, yb + 0.17, cz);
  }
  const light = new THREE.PointLight(0xffd9a6, 5, 10, 1.6);
  light.position.set(0, yb + 0.1, 0);
  g.add(light);
  g.position.set(x, 0, z);
  roomGroup.add(g);
}


/* UV en mètres pour tous les murs (plans et volumes) : l'enduit garde la même
   échelle partout, sans étirement sur les piliers ni sur la cloison. */
function wallWorldUV(g){
  if(g.userData.worldUV) return; g.userData.worldUV = true;
  const uv = g.attributes.uv, P = g.parameters || {}, T = 3;
  if(g.type === 'PlaneGeometry'){
    for(let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i)*P.width/T, uv.getY(i)*P.height/T);
  } else if(g.type === 'BoxGeometry'){
    const w = P.width, h = P.height, d = P.depth;
    const dims = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
    for(let i = 0; i < uv.count; i++){ const f = dims[Math.floor(i/4)] || [1,1]; uv.setXY(i, uv.getX(i)*f[0]/T, uv.getY(i)*f[1]/T); }
  } else return;
  uv.needsUpdate = true;
}


/* ---------- Ombres de contact : jonctions mur/sol et mur/plafond ----------
   Dégradés sombres très doux (comme l'occlusion ambiante d'une vraie pièce),
   quelques plans transparents seulement : aucun coût d'ombre temps réel. */
let _aoTex = null;
function aoGradient(){
  if(_aoTex) return _aoTex;
  const c = document.createElement('canvas'); c.width = 4; c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 128);
  // alphaMap lit le canal vert : niveaux de gris opaques
  g.addColorStop(0, 'rgb(255,255,255)');
  g.addColorStop(0.25, 'rgb(115,115,115)');
  g.addColorStop(0.6, 'rgb(26,26,26)');
  g.addColorStop(1, 'rgb(0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 4, 128);
  _aoTex = new THREE.CanvasTexture(c);
  return _aoTex;
}
function addContactShadows(geo){
  const k = 0.5;
  const mk = (op) => new THREE.MeshBasicMaterial({ color:0x000000, alphaMap:aoGradient(), transparent:true,
    opacity:op, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2 });
  const matFloor = mk(k), matWall = mk(k*0.85), matCeil = mk(k*0.7);
  const up = new THREE.Vector3(0, 1, 0);
  geo.faces.forEach(f => {
    if(f.id.startsWith('lintel')) return;
    const L = f.len, mx = f.a.x + f.dir.x*L/2, mz = f.a.z + f.dir.z*L/2;
    const yaw = Math.atan2(f.n.x, f.n.z);
    // bas du mur (dégradé vers le haut)
    const wb = new THREE.Mesh(new THREE.PlaneGeometry(L, 0.32), matWall);
    wb.position.set(mx + f.n.x*0.003, 0.16, mz + f.n.z*0.003);
    wb.rotation.y = yaw; wb.rotation.z = Math.PI; // texture : opaque côté sol
    wb.rotation.order = 'YXZ';
    roomGroup.add(wb);
    // sol le long du mur (dégradé vers la pièce)
    if(f.id !== 'window'){
      const fl = new THREE.Mesh(new THREE.PlaneGeometry(L, 0.42), matFloor);
      fl.rotation.order = 'YXZ'; fl.rotation.y = yaw; fl.rotation.x = -Math.PI/2;
      fl.position.set(mx + f.n.x*0.21, 0.004, mz + f.n.z*0.21);
      roomGroup.add(fl);
    }
    // haut du mur, sous le plafond
    const wt = new THREE.Mesh(new THREE.PlaneGeometry(L, 0.5), matCeil);
    wt.position.set(mx + f.n.x*0.003, geo.H - 0.25, mz + f.n.z*0.003);
    wt.rotation.y = yaw;
    roomGroup.add(wt);
  });
}

function buildRoom(geo, nArt){
  scene.remove(roomGroup);
  roomGroup = new THREE.Group();
  occluders = [];

  const width = geo.W, depth = geo.D, height = geo.H;
  roomBounds = {
    minX:-width/2+0.6, maxX:width/2-0.6, minZ:-depth/2+0.6, maxZ:depth/2-0.6,
    W2:geo.W2, D2:geo.D2, solids:geo.solids,
    obstacles: geo.solids.map(s => ({ minX:s.minX-0.35, maxX:s.maxX+0.35, minZ:s.minZ-0.35, maxZ:s.maxZ+0.35 }))
  };

  // Sol : reflet miroir (Reflector) + matière par-dessus. Sur mobile, au-delà
  // de 12 œuvres, le reflet (qui redessine toute la salle) est abandonné.
  const useReflector = !(isTouchDevice && nArt > 12);
  const parquet = SKIN.floor === 'parquet';
  const planks = SKIN.floor === 'planks';
  const marble = SKIN.floor === 'marble';
  const fTex = parquet ? parquetTexture() : planks ? plankTexture() : marble ? marbleTexture() : floorTex;
  const tile = parquet ? 1.8 : planks ? 2.4 : marble ? 2.4 : 1.4;
  fTex.repeat.set(width/tile, depth/tile);
  floorBumpTex.repeat.set(width/1.4, depth/1.4);
  if(useReflector){
    const floorReflector = new Reflector(new THREE.PlaneGeometry(width, depth), {
      // Reflet à la résolution de l'écran sur ordinateur : en dessous, le
      // reflet des murs paraît pixelisé quand on tourne la tête.
      textureWidth: isTouchDevice ? 512 * Math.min(window.devicePixelRatio, 1.5)
                                  : Math.min(2048, window.innerWidth * Math.min(window.devicePixelRatio, 2)),
      textureHeight: isTouchDevice ? 512 * Math.min(window.devicePixelRatio, 1.5)
                                   : Math.min(2048, window.innerHeight * Math.min(window.devicePixelRatio, 2)),
      color: SKIN.reflectorColor,
      clipBias: 0.003,
    });
    floorReflector.rotation.x = -Math.PI/2;
    floorReflector.position.y = 0.001;
    roomGroup.add(floorReflector);
  }
  const floorOverlay = new THREE.Mesh(
    new THREE.PlaneGeometry(width, depth),
    new THREE.MeshStandardMaterial({
      map: fTex, bumpMap: floorBumpTex, bumpScale: SKIN.floorBump ?? 0.015,
      roughness: SKIN.overlayRoughness, metalness: 0.05,
      transparent: useReflector, opacity: useReflector ? SKIN.overlayOpacity : 1, depthWrite: !useReflector
    })
  );
  floorOverlay.rotation.x = -Math.PI/2;
  floorOverlay.position.y = 0.0025;
  floorOverlay.receiveShadow = true;
  roomGroup.add(floorOverlay);

  // UV des murs en mètres (voir wallWorldUV) : pas de répétition à régler ici
  const wallMat = new THREE.MeshStandardMaterial({
    color: SKIN.wallColor, roughness: SKIN.wallRoughness,
    bumpMap: wallBumpTex, bumpScale: SKIN.wallBump,
    roughnessMap: wallRoughTex, map: wallColorTex
  });
  // Les spots éclairent vers le bas : sans un léger éclat propre, le plafond
  // d'une salle claire paraît gris foncé (salle sombre : ceilGlow = 0).
  const ceilMat = new THREE.MeshStandardMaterial({
    color: SKIN.ceilColor, roughness:1,
    emissive: SKIN.ceilColor, emissiveIntensity: SKIN.ceilGlow || 0
  });

  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(width, height), wallMat);
  backWall.position.set(0, height/2, -depth/2);
  backWall.receiveShadow = true;
  roomGroup.add(backWall);

  const frontWall = backWall.clone();
  frontWall.position.z = depth/2;
  frontWall.rotation.y = Math.PI;
  roomGroup.add(frontWall);

  const sideGeo = new THREE.PlaneGeometry(depth, height);
  const leftWall = new THREE.Mesh(sideGeo, wallMat);
  leftWall.position.set(-width/2, height/2, 0);
  leftWall.rotation.y = Math.PI/2;
  leftWall.receiveShadow = true;
  roomGroup.add(leftWall);

  const rightWall = leftWall.clone();
  rightWall.position.x = width/2;
  rightWall.rotation.y = -Math.PI/2;
  roomGroup.add(rightWall);

  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(width, depth), ceilMat);
  ceiling.position.y = height;
  ceiling.rotation.x = Math.PI/2;
  roomGroup.add(ceiling);

  // Piliers en saillie : créent des alcôves et de nouveaux pans d'accrochage
  function addPillar(zCenter, side){
    const wallX = side < 0 ? -width/2 : width/2;
    const innerX = wallX - side*geo.reach;
    const pillar = new THREE.Mesh(new THREE.BoxGeometry(geo.reach, height, TH), wallMat);
    pillar.position.set((wallX+innerX)/2, height/2, zCenter);
    pillar.castShadow = true;
    pillar.receiveShadow = true;
    roomGroup.add(pillar);
    occluders.push(pillar);
  }
  addPillar(geo.zL, -1);
  addPillar(geo.zR, 1);

  // Cloison avec passage : sépare la grande salle de la deuxième salle
  {
    const doorZ = geo.doorZ, doorHalf = geo.doorHalf, doorTop = geo.doorTop;
    const stubW = width/2 - doorHalf;
    const doorWallMat = wallMat.clone();
    const leftStub = new THREE.Mesh(new THREE.BoxGeometry(stubW, height, PT), doorWallMat);
    leftStub.position.set(-(width/2+doorHalf)/2, height/2, doorZ);
    const rightStub = new THREE.Mesh(new THREE.BoxGeometry(stubW, height, PT), doorWallMat);
    rightStub.position.set((width/2+doorHalf)/2, height/2, doorZ);
    const lintel = new THREE.Mesh(new THREE.BoxGeometry(doorHalf*2, height-doorTop, PT), doorWallMat);
    lintel.position.set(0, doorTop+(height-doorTop)/2, doorZ);
    [leftStub, rightStub, lintel].forEach(m => { m.castShadow = true; m.receiveShadow = true; roomGroup.add(m); occluders.push(m); });

    if(SKIN.woodAccent){
      // Mur d'accent bois dans la deuxième salle
      const woodTex = makeWoodAccentTexture();
      const accentDepth = depth/2 - doorZ - 0.3;
      if(accentDepth > 1.2){
        woodTex.repeat.set(accentDepth/1.2, 1);
        const accentMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness:0.55 });
        const accentWall = new THREE.Mesh(new THREE.PlaneGeometry(accentDepth, height*0.9), accentMat);
        accentWall.position.set(width/2-0.02, height*0.45, (doorZ + depth/2)/2 + 0.15);
        accentWall.rotation.y = -Math.PI/2;
        roomGroup.add(accentWall);
      }
    }
  }

  // Appliques rasantes sur les murs sombres (salle sombre uniquement),
  // plafonnées pour rester fluides dans les grandes salles et sur mobile.
  if(SKIN.wallWash){
    const washY = height - 0.5;
    const capN = 1;
    const wallWashSpot = (x,y,z, tx,ty,tz) => {
      const spot = new THREE.SpotLight(SKIN.spotColor || 0xfff0d2, 8, 7.5, Math.PI/4.2, 0.6, 1.3);
      spot.position.set(x,y,z);
      spot.castShadow = false;
      const target = new THREE.Object3D();
      target.position.set(tx,ty,tz);
      scene.add(target);
      spot.target = target;
      scene.add(spot);
    };
    const addWallWash = (count, make) => {
      for(let i=0;i<count;i++){
        const { pos, target } = make((i+0.5)/count);
        wallWashSpot(pos[0], pos[1], pos[2], target[0], target[1], target[2]);
      }
    };
    const leftN = Math.min(capN, Math.max(2, Math.round(depth/6)));
    addWallWash(leftN, t => ({ pos:[-width/2+0.6, washY, -depth/2 + t*depth], target:[-width/2+0.05, 0.3, -depth/2 + t*depth] }));
    addWallWash(leftN, t => ({ pos:[width/2-0.6, washY, -depth/2 + t*depth], target:[width/2-0.05, 0.3, -depth/2 + t*depth] }));
    const endN = Math.min(capN, Math.max(2, Math.round(width/6)));
    addWallWash(endN, t => ({ pos:[-width/2 + t*width, washY, -depth/2+0.6], target:[-width/2 + t*width, 0.3, -depth/2+0.05] }));
    addWallWash(endN, t => ({ pos:[-width/2 + t*width, washY, depth/2-0.6], target:[-width/2 + t*width, 0.3, depth/2-0.05] }));
  }

  /* FENÊTRE (mur gauche, grande salle) : vraie ouverture + embrasure +
     menuiserie + vitre + paysage + soleil qui entre par l'ouverture. */
  if(geo.win){
    const WS = SKIN.window;
    const { zc, zA, zB, winW } = geo.win;
    const winSill = WS.sill, winTop = WS.top, winH = winTop - winSill;
    const midY = (winSill + winTop)/2;
    const revealT = 0.42;
    const wallX = -width/2;
    const frameX = wallX - 0.22;

    // 1) Mur gauche percé
    const shape = new THREE.Shape();
    shape.moveTo(-depth/2, -height/2);
    shape.lineTo( depth/2, -height/2);
    shape.lineTo( depth/2,  height/2);
    shape.lineTo(-depth/2,  height/2);
    shape.lineTo(-depth/2, -height/2);
    const hole = new THREE.Path();
    const lx0 = -zB, lx1 = -zA;                 // le mur est tourné : x local = -z monde
    const ly0 = winSill - height/2, ly1 = winTop - height/2;
    hole.moveTo(lx0, ly0); hole.lineTo(lx0, ly1); hole.lineTo(lx1, ly1); hole.lineTo(lx1, ly0); hole.lineTo(lx0, ly0);
    shape.holes.push(hole);
    const holeGeo = new THREE.ShapeGeometry(shape);
    const hp = holeGeo.attributes.position, hu = holeGeo.attributes.uv;
    for(let i=0;i<hp.count;i++){
      hu.setXY(i, (hp.getX(i)+depth/2)/3, (hp.getY(i)+height/2)/3);
    }
    hu.needsUpdate = true;
    leftWall.geometry = holeGeo;

    // 2) Embrasure
    const revealMat = wallMat.clone();
    revealMat.side = THREE.DoubleSide;
    const revBottom = new THREE.Mesh(new THREE.PlaneGeometry(revealT, winW), revealMat);
    revBottom.rotation.x = -Math.PI/2; revBottom.position.set(wallX-revealT/2, winSill, zc);
    const revTop = new THREE.Mesh(new THREE.PlaneGeometry(revealT, winW), revealMat);
    revTop.rotation.x = Math.PI/2; revTop.position.set(wallX-revealT/2, winTop, zc);
    const revA = new THREE.Mesh(new THREE.PlaneGeometry(revealT, winH), revealMat);
    revA.position.set(wallX-revealT/2, midY, zA);
    const revB = new THREE.Mesh(new THREE.PlaneGeometry(revealT, winH), revealMat);
    revB.position.set(wallX-revealT/2, midY, zB);
    [revBottom, revTop, revA, revB].forEach(m => { m.receiveShadow = true; roomGroup.add(m); });

    // 3) Menuiserie (cadre + petits bois)
    const frameMat = new THREE.MeshStandardMaterial({ color:WS.frameColor, roughness:WS.frameRough, metalness:WS.frameMetal });
    const addBar = (dx,dy,dz,x,y,z) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(dx,dy,dz), frameMat);
      m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
      roomGroup.add(m); return m;
    };
    const bt = 0.09, mull = WS.mull;
    addBar(0.12, bt, winW, frameX, winSill+bt/2, zc);
    addBar(0.12, bt, winW, frameX, winTop-bt/2, zc);
    addBar(0.12, winH, bt, frameX, midY, zA+bt/2);
    addBar(0.12, winH, bt, frameX, midY, zB-bt/2);
    for(let i=1;i<WS.cols;i++){
      const center = WS.cols % 2 === 0 && i === WS.cols/2;   // battement central des deux vantaux
      addBar(0.10, winH-2*bt, center ? bt : mull, frameX, midY, zA + winW*i/WS.cols);
    }
    for(let j=1;j<WS.rows;j++){
      const y = WS.rows === 2 ? winSill + winH*0.64 : winSill + winH*j/WS.rows;
      addBar(0.10, mull, winW-2*bt, frameX, y, zc);
    }

    // 4) Vitre
    const glass = new THREE.Mesh(
      new THREE.PlaneGeometry(winW-2*bt, winH-2*bt),
      new THREE.MeshStandardMaterial({
        color:0xd6e8f2, transparent:true, opacity:0.14, roughness:0.03, metalness:0,
        envMapIntensity:1.6, depthWrite:false, side:THREE.DoubleSide
      })
    );
    glass.rotation.y = Math.PI/2; glass.position.set(frameX, midY, zc); glass.renderOrder = 2;
    roomGroup.add(glass);

    // 5) Moulures côté salle + appui (ou seuil pour une porte-fenêtre)
    const trimMat = new THREE.MeshStandardMaterial({ color:0xfdfbf7, roughness:0.6 });
    const addTrim = (dx,dy,dz,x,y,z) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(dx,dy,dz), trimMat);
      m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
      roomGroup.add(m);
    };
    addTrim(0.05, 0.16, winW+0.32, wallX+0.025, winTop+0.08, zc);
    addTrim(0.05, winH+0.16, 0.16, wallX+0.025, midY+0.08, zA-0.08);
    addTrim(0.05, winH+0.16, 0.16, wallX+0.025, midY+0.08, zB+0.08);
    if(winSill > 0.4) addTrim(0.36, 0.05, winW+0.36, wallX+0.13, winSill-0.02, zc);
    else addTrim(0.12, 0.03, winW+0.2, wallX+0.05, winSill-0.015, zc);

    // 5bis) Balcon en fer forgé (porte-fenêtre Haussmann)
    if(WS.railing){
      const iron = new THREE.MeshStandardMaterial({ color:0x1d1c1a, roughness:0.5, metalness:0.5 });
      const slab = new THREE.Mesh(
        new THREE.BoxGeometry(0.75, 0.1, winW+0.6),
        new THREE.MeshStandardMaterial({ color:0xcfc6b5, roughness:0.85 })
      );
      slab.position.set(wallX-revealT-0.3, winSill-0.05, zc);
      slab.receiveShadow = true;
      roomGroup.add(slab);
      const rx = wallX - revealT - 0.28, railLen = winW + 0.3;
      const addIron = (geom, x, y, z) => { const m = new THREE.Mesh(geom, iron); m.position.set(x,y,z); m.castShadow = true; roomGroup.add(m); return m; };
      addIron(new THREE.BoxGeometry(0.06, 0.05, railLen), rx, winSill+1.0, zc);
      addIron(new THREE.BoxGeometry(0.03, 0.03, railLen), rx, winSill+0.12, zc);
      addIron(new THREE.BoxGeometry(0.03, 0.03, railLen), rx, winSill+0.82, zc);
      const nb = Math.round(railLen/0.12);
      const balGeo = new THREE.BoxGeometry(0.018, 0.86, 0.018);
      for(let i=0;i<=nb;i++) addIron(balGeo, rx, winSill+0.55, zc - railLen/2 + i*railLen/nb);
      const ringGeo = new THREE.TorusGeometry(0.04, 0.007, 6, 20);
      for(let i=0;i<nb;i++) addIron(ringGeo, rx, winSill+0.91, zc - railLen/2 + (i+0.5)*railLen/nb).rotation.y = Math.PI/2;
    }

    // 6) Extérieur : photo de paysage en grand fond éloigné
    const landscapeTex = new THREE.TextureLoader().load('/visite-3d/paysage.jpg');
    landscapeTex.colorSpace = THREE.SRGBColorSpace;
    const landscapeRatio = 1600/1057;
    const landH = 60, landW = landH*landscapeRatio;
    const landscape = new THREE.Mesh(
      new THREE.PlaneGeometry(landW, landH),
      new THREE.MeshBasicMaterial({ map: landscapeTex, fog:false })
    );
    landscape.rotation.y = Math.PI/2;
    landscape.position.set(wallX - 48, 0.85 + landH*0.34, zc);
    roomGroup.add(landscape);
    const skyBackdrop = new THREE.Mesh(
      new THREE.PlaneGeometry(landW*2.4, landH*2.4),
      new THREE.MeshBasicMaterial({ color:0xbcd6ea, fog:false })
    );
    skyBackdrop.rotation.y = Math.PI/2;
    skyBackdrop.position.set(wallX - 60, 0.85 + landH*0.34, zc);
    roomGroup.add(skyBackdrop);

    // 7) Soleil + bloqueurs invisibles (la lumière n'entre que par la fenêtre)
    const sunElev = 35*Math.PI/180;
    const toSun = new THREE.Vector3(-Math.cos(sunElev), Math.sin(sunElev), 0.26).normalize();
    const sunTarget = new THREE.Object3D();
    sunTarget.position.set(wallX + 3.42, 0, zc - 1.09);
    const sun = new THREE.DirectionalLight(0xffd29a, SKIN.sun);
    sun.position.copy(sunTarget.position).addScaledVector(toSun, 34);
    sun.target = sunTarget;
    sun.castShadow = true;
    const sMap = isTouchDevice ? 1024 : 2048;
    sun.shadow.mapSize.set(sMap, sMap);
    const sc = sun.shadow.camera;
    sc.left = -14; sc.right = 14; sc.top = 14; sc.bottom = -14; sc.near = 1; sc.far = 80;
    sc.updateProjectionMatrix();
    sun.shadow.bias = -0.0003;
    sun.shadow.normalBias = 0.02;
    sun.shadow.radius = 3;
    roomGroup.add(sun); roomGroup.add(sunTarget);

    const blockMat = new THREE.MeshBasicMaterial({ colorWrite:false, depthWrite:false, side:THREE.DoubleSide });
    const addBlocker = (geom, x, y, z, rx, ry) => {
      const m = new THREE.Mesh(geom, blockMat);
      m.position.set(x,y,z); m.rotation.x = rx||0; m.rotation.y = ry||0;
      m.castShadow = true; m.receiveShadow = false;
      roomGroup.add(m);
    };
    addBlocker(holeGeo, wallX-0.05, height/2, 0, 0, Math.PI/2);
    addBlocker(new THREE.PlaneGeometry(width+2, depth+2), 0, height+0.05, 0, Math.PI/2, 0);
    addBlocker(new THREE.PlaneGeometry(width+2, height+1), 0, height/2, depth/2+0.05, 0, 0);
  }

  roomGroup.traverse(m => { if(m.isMesh && m.material && m.material.bumpMap === wallBumpTex) wallWorldUV(m.geometry); });
  addMoldings(geo);
  addContactShadows(geo);

  scene.add(roomGroup);
}

/* ---------------------------------------------------------------------- */
/* 5. ŒUVRES                                                               */
/* ---------------------------------------------------------------------- */
const textureLoader = new THREE.TextureLoader();
textureLoader.crossOrigin = 'anonymous';
let frameGroups = []; // { group, data, mesh }
let loadedCount = 0;

function makeGeneratedArtTexture(seed){
  // Petite toile abstraite générative (dégradé + formes), utilisée pour les
  // œuvres de démo afin de ne dépendre d'aucune image externe.
  let s = seed * 9301 + 49297;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const c = document.createElement('canvas'); c.width = 512; c.height = 384;
  const ctx = c.getContext('2d');
  const hue = Math.floor(rnd() * 360);
  const grad = ctx.createLinearGradient(0, 0, 512, 384);
  grad.addColorStop(0, `hsl(${hue},32%,90%)`);
  grad.addColorStop(1, `hsl(${(hue + 45) % 360},28%,76%)`);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 512, 384);
  for(let i = 0; i < 6; i++){
    ctx.fillStyle = `hsla(${(hue + i * 37) % 360}, 55%, ${35 + rnd() * 25}%, ${0.45 + rnd() * 0.35})`;
    ctx.beginPath();
    ctx.ellipse(rnd() * 512, rnd() * 384, 50 + rnd() * 150, 35 + rnd() * 100, rnd() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = `hsla(${hue},25%,18%,0.3)`; ctx.lineWidth = 2;
  for(let i = 0; i < 4; i++){
    ctx.beginPath();
    ctx.moveTo(rnd() * 512, rnd() * 384);
    ctx.lineTo(rnd() * 512, rnd() * 384);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}


// Ombre portée douce du cadre sur le mur (décalée vers le bas : lumière
// venant du plafond). Précalculée : réaliste même sans ombre temps réel.
let _frameShadowTex = null;
function frameShadowTexture(){
  if(_frameShadowTex) return _frameShadowTex;
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, S, S);
  ctx.filter = 'blur(14px)';
  ctx.fillStyle = '#fff'; ctx.fillRect(34, 34, S-68, S-68);
  _frameShadowTex = new THREE.CanvasTexture(c);
  return _frameShadowTex;
}
function createFrame(art){
  const w = Math.max(0.25, (art.widthCm||60)/100);
  const h = Math.max(0.25, (art.heightCm||45)/100);
  const border = 0.06;

  const group = new THREE.Group();
  group.userData.art = art;

  // Cadre : bois avec un léger vernis (clearcoat) qui accroche la lumière
  // des spots et les reflets de l'environnement HDRI, plus crédible qu'un
  // mat plat.
  const frameMat = new THREE.MeshPhysicalMaterial({
    color:0x3b2c20, roughness:0.45, metalness:0.1,
    clearcoat:0.5, clearcoatRoughness:0.35
  });
  const frame = new THREE.Mesh(new THREE.BoxGeometry(w+border*2, h+border*2, 0.04), frameMat);
  frame.castShadow = true;
  group.add(frame);

  const shadowPlane = new THREE.Mesh(
    new THREE.PlaneGeometry((w+border*2)*1.16 + 0.1, (h+border*2)*1.16 + 0.12),
    new THREE.MeshBasicMaterial({ color:0x000000, alphaMap:frameShadowTexture(), transparent:true,
      opacity:0.65, depthWrite:false })
  );
  shadowPlane.position.set(0, -0.05, -0.056);
  group.add(shadowPlane);

  const matMat = new THREE.MeshStandardMaterial({ color:0xf7f4ec, roughness:0.95 });
  const passe = new THREE.Mesh(new THREE.PlaneGeometry(w+border, h+border), matMat);
  passe.position.z = 0.021;
  group.add(passe);

  const placeholderMat = new THREE.MeshStandardMaterial({ color:0x8f887a, roughness:0.9 });
  const canvasMesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), placeholderMat);
  canvasMesh.position.z = 0.023;
  canvasMesh.castShadow = true;
  group.add(canvasMesh);

  function applyArtTexture(tex){
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.generateMipmaps = true;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.needsUpdate = true;
    // Léger vernis (clearcoat faible) qui capte un reflet discret de la
    // pièce — évite l'effet "poster mat" tout en restant lisible.
    canvasMesh.material = new THREE.MeshPhysicalMaterial({
      map:tex, roughness:0.82, clearcoat:0.18, clearcoatRoughness:0.4
    });
    // Œuvre sans spot dédié (très grande galerie) : léger éclat propre
    if(group.userData.glow){
      canvasMesh.material.emissiveMap = tex;
      canvasMesh.material.emissive = new THREE.Color(0xffffff);
      canvasMesh.material.emissiveIntensity = group.userData.glow;
    }
  }

  if((art.imageUrl || '').startsWith('generated:')){
    applyArtTexture(makeGeneratedArtTexture(parseInt(art.imageUrl.split(':')[1], 10) || 1));
  } else {
    textureLoader.load(art.imageUrl, applyArtTexture, undefined, () => { /* garde le placeholder si l'image échoue */ });
  }

  const labelDiv = document.createElement('div');
  labelDiv.className = 'label3d';
  labelDiv.textContent = art.title || '';
  const labelSub = document.createElement('span');
  labelSub.className = 'a';
  labelSub.textContent = (art.artist||'') + (art.year ? ' · '+art.year : '');
  labelDiv.appendChild(labelSub);
  const label = new CSS2DObject(labelDiv);
  label.position.set(0, -(h/2+border+0.14), 0.03);
  group.add(label);

  return { group, art, canvasMesh, w, h, label };
}

function layoutArtworks(){
  frameGroups.forEach(f => roomGroup.remove(f.group));
  frameGroups = [];

  const items = artworks.map(art => ({ art, ...artSize(art) }));
  const { geo, segs } = planLayout(items);
  roomGeo = geo;
  buildRoom(geo, items.length);

  // Mobile + grande galerie : résolution légèrement réduite pour rester fluide
  if(isTouchDevice && items.length > 12){
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    composer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    composer.setSize(window.innerWidth, window.innerHeight);
  }

  const slots = computeSlots(geo, segs);
  slots.forEach(slot => {
    const f = createFrame(slot.it.art);
    f.group.position.set(slot.x, slot.y, slot.z);
    f.group.rotation.y = slot.rotY;
    f.slot = slot;
    f.group.traverse(o => { o.userData.frame = f; });
    roomGroup.add(f.group);
    frameGroups.push(f);
  });
  frameGroups.sort((a, b) => tourKey(geo, a.slot) - tourKey(geo, b.slot));

  // Éclairage : un spot par œuvre (ou par petit groupe au-delà du plafond)
  const chandeliers = SKIN.haussmann ? (geo.mainLen > 14 ? 2 : 1) : 0;
  const centerShadow = SKIN.centerSpot && !isTouchDevice;
  const unlit = placeSpots(geo, segs,
             MAX_SPOTS - (SKIN.centerSpot ? 1 : 0) - chandeliers,
             MAX_SHADOW_SPOTS - (centerShadow ? 1 : 0));
  unlit.forEach(slot => {
    const f = frameGroups.find(x => x.slot === slot);
    if(!f) return;
    f.group.userData.glow = 0.3;
    const m = f.canvasMesh.material;
    if(m.map){ m.emissiveMap = m.map; m.emissive.set(0xffffff); m.emissiveIntensity = 0.3; m.needsUpdate = true; }
  });
  if(SKIN.centerSpot){
    addTrackSpot(0, geo.H-0.15, geo.zMainC, 0, 1.5, geo.zMainC, { shadow: centerShadow });
  }
  for(let i = 0; i < chandeliers; i++){
    addChandelier(0, -geo.D2 + geo.mainLen*(i+1)/(chandeliers+1), geo.H);
  }

  // Point de départ : face au mur du fond, au cœur de la grande salle
